<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEGALUX | Dark Luxury Wear</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="description" content="Underground, obscure and extreme textures. More than clothes, it's a lifestyle.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0b0b0b;
      color: #e5e5e5;
    }
    h1, h2, h3, .font-serif {
      font-family: 'Cinzel', serif;
    }
    /* Smooth 3D Scroll & Zoom Animations */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(40px) perspective(1000px) rotateX(8deg);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-on-scroll.active {
      opacity: 1;
      transform: translateY(0) perspective(1000px) rotateX(0deg);
    }
    .img-zoom-hover {
      overflow: hidden;
    }
    .img-zoom-hover img {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .img-zoom-hover:hover img {
      transform: scale(1.08);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500 selection:text-black">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2">
        <img src="logo.png" alt="JEGALUX Logo" class="h-10 w-auto object-contain">
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm tracking-widest uppercase font-medium">
        <a href="#catalog" class="hover:text-amber-500 transition-colors">Catalog</a>
        <a href="#lookbook" class="hover:text-amber-500 transition-colors">Lookbook</a>
        <a href="#limited" class="hover:text-amber-500 transition-colors">Limited Editions</a>
        <a href="#manifesto" class="hover:text-amber-500 transition-colors">Manifesto</a>
        <a href="#vip" class="hover:text-amber-500 transition-colors">VIP</a>
      </nav>
      <a href="#catalog" class="bg-amber-500 text-black px-6 py-2.5 text-xs font-bold uppercase tracking-widest hover:bg-amber-400 transition-colors">
        Order Yours
      </a>
    </div>
  </header>

  <!-- Hero Section (Narrow, Darker Banner with Gothic Emblem Background & Zoom) -->
  <section class="relative min-h-[65vh] flex items-center justify-center text-center px-4 overflow-hidden border-b border-zinc-800">
    <div class="absolute inset-0 z-0 overflow-hidden">
      <img src="Emblema%20g%C3%B3tico%20de%20hueso%20sobre%20negro.png" alt="Gothic Emblem Background" class="w-full h-full object-cover opacity-60 brightness-110 scale-100 hover:scale-105 transition-transform duration-1000">
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent">
